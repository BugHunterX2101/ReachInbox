# Render Blueprint — one always-on API service (workers in-process), one web service.
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
# Free tier: services spin down after ~15 min idle; first request takes ~50s to wake.
#
# DATABASE: external Neon Postgres (free, no 30-day expiry). No Render-managed
# Postgres created — DATABASE_URL is a sync:false env var pointing at Neon.
# Redis: free Render Key Value (persists, Redis-compatible) for BullMQ + rate limits.
#
# Elasticsearch has no free managed host — this deployment runs the whole engine
# WITHOUT ES: packages/search owns availability policy, query service falls back to
# Postgres (§7.3), index/reindex are no-ops. Set ELASTICSEARCH_URL to enable.
#
# SYNC=FALSE SECRETS: Render prompts for these during Blueprint creation (or keeps
# existing values if applied to already-running services). Fill with the real values:
#   DATABASE_URL     → Neon connection string (see .env.example)
#   ENCRYPTION_KEY   → 64 hex chars (openssl rand -hex 32) — MUST match existing key
#                       if Neon DB already has encrypted sender passwords
#   GOOGLE_CLIENT_ID/SECRET → from Google Cloud Console OAuth app
#   GOOGLE_REDIRECT_URI     → https://reachinbox-web-kugh.onrender.com/api/auth/google/callback
#   SLACK_CLIENT_ID/SECRET  → from api.slack.com app
#   SLACK_REDIRECT_URI      → https://reachinbox-web-kugh.onrender.com/api/integrations/slack/callback
#   WEB_URL                 → https://reachinbox-web-kugh.onrender.com
#   API_INTERNAL_URL        → https://reachinbox-api-1187.onrender.com
#   NEXT_PUBLIC_API_URL     → same as API_INTERNAL_URL

services:
  - type: keyvalue
    name: reachinbox-kv
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@11.10.0 install --frozen-lockfile && npx --yes pnpm@11.10.0 --filter=!@reachinbox/web build
    preDeployCommand: sh infra/render/predeploy.sh
    startCommand: sh infra/render/boot-setup.sh && node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: reachinbox-kv
          type: keyvalue
          property: url
      - key: ELASTICSEARCH_URL
        value: disabled
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: WORKER_INPROCESS
        value: "true"
      - key: ATTACHMENT_DATA_DIR
        value: /tmp/attachments
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: WEB_URL
        sync: false

  - type: web
    name: reachinbox-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@11.10.0 install --frozen-lockfile && npx --yes pnpm@11.10.0 --filter @reachinbox/shared-types build && npx --yes pnpm@11.10.0 --filter @reachinbox/web build
    startCommand: pnpm --filter @reachinbox/web start
    healthCheckPath: /
    autoDeploy: true
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: WEB_URL
        sync: false
